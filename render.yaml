services:
  - type: web
    name: academy-management-api
    runtime: node
    rootDir: server
    # Not free: a free web service spins down after ~15 min idle, and the
    # in-process node-cron jobs (server/src/jobs/cron.jobs.js) don't fire while
    # it sleeps. runStartupCatchUp() rescues the daily ones on the next boot,
    # but class-reminders runs every 5 minutes — a "class starting soon" alert
    # replayed hours late is worse than useless.
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    # NOTE: this blueprint is not what currently runs. The live service is named
    # "lovel" (lovel-1fyg.onrender.com), was created by hand in the dashboard and
    # deploys straight from the repo, so nothing below configures it — the real
    # values are whatever the dashboard holds, and the plan is free, not starter.
    # Adopting the blueprint is what would make this file true again.
    envVars:
      - key: NODE_ENV
        value: production
      # Node sizes its heap from the memory it believes the machine has, and in
      # a container that is the host's, not the 512 MB this instance gets: left
      # alone it reports a ~4 GB ceiling and will happily grow past the limit,
      # at which point the kernel kills it (exit 137) with no V8 error to show
      # for it. Capping the heap makes the process fail as a Node heap error we
      # can read instead. 320 MB leaves room for the Prisma query engine, which
      # is a separate process billed to the same container.
      #
      # Also set on `npm run start` so it applies whether or not this blueprint
      # is the thing configuring the service.
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      # Not sync:false any more. It was left for the dashboard and the dashboard
      # held "http://localhost:5173", which every invite link inherited — they
      # pointed at the recipient's own machine. It is a public address, not a
      # secret, so the blueprint is the right place for it.
      - key: FRONTEND_URL
        value: https://lovelearning-three.vercel.app
      # This service's own public URL. Invitation links point at it so they can
      # outlive Firebase's one-hour password links (see invite.service.js).
      # fromService reads it from Render rather than trusting a hand-typed copy.
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: academy-management-api
          property: host
      # ENABLE_TEST_LOGIN is deliberately NOT set here — it defaults to off in
      # production. The old value: "true" let anyone log in as any seeded user
      # (including the admin) with no password via an x-dev-user-email header.
      # Only set it to "true" in Render's dashboard for a throwaway staging
      # service, never on the real production API.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # "gemini" in production. Ollama is local-only — there is no Ollama at
      # localhost:11434 inside a Render container, so that setting makes every
      # lesson-plan summary fall through to the plain-text fallback.
      - key: AI_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # The From address for every outgoing email. Must be on a domain verified
      # in Resend — Resend refuses anything else, and with no domain verified it
      # only ever delivers to the account owner's own address. Undeclared, the
      # code falls back to noreply@lovelearning.app, a domain nobody owns.
      - key: EMAIL_FROM
        sync: false
      # Shared secret for the Google Form Apps Script trigger. Must match the
      # FORM_INTAKE_SECRET script property on the Apps Script side; without it
      # /api/intake refuses every request.
      - key: FORM_INTAKE_SECRET
        sync: false
      # Drive uploads act as the academy's Google account, not a service
      # account: a service account owns what it uploads and has a storage quota
      # of zero on a non-Workspace account, so every upload fails silently.
      # NOT the same value as GMAIL_REFRESH_TOKEN. They are two different
      # tokens that happen to be the same length; this one carries the drive
      # scope (plus gmail.send) and the other does not. Copying the Gmail one
      # here reports a healthy "oauth" mode while every Drive call fails.
      # The working value lives in server/.env as DRIVE_REFRESH_TOKEN.
      - key: DRIVE_REFRESH_TOKEN
        sync: false
      # Legacy service-account path, kept only for older deployments. It cannot
      # store anything; DRIVE_REFRESH_TOKEN above supersedes it.
      - key: DRIVE_CLIENT_EMAIL
        sync: false
      - key: DRIVE_PRIVATE_KEY
        sync: false
      - key: DRIVE_MARKETING_FOLDER_ID
        sync: false
      - key: DRIVE_CHAT_FOLDER_ID
        sync: false
      - key: DRIVE_WAIVERS_FOLDER_ID
        sync: false
